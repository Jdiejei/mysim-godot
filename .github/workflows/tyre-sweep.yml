name: controlled-native-tyre-parameter-sweep
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project tools/TyreSweep -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: controlled-tyre-sweep, path: outputs/tyre-sweep, retention-days: 14}
