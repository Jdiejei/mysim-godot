name: summarize-existing-native-campaign
on:
  workflow_dispatch:
    inputs:
      source_run: {type: string, required: true}
      cars: {type: string, required: true}
permissions: {contents: read, actions: read}
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing terminal artifacts without rerunning races
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          EXPECTED_CARS: ${{ inputs.cars }}
        run: python tools/cloud_campaign_summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-summary
          path: campaign-summary.json
          if-no-files-found: error
