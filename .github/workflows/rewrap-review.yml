name: rewrap-encrypted-review-evidence
on:
  workflow_dispatch:
    inputs:
      assets: {description: 'Comma-separated exact encrypted review asset names (up to8)', type: string, required: true}
permissions: {contents: write}
jobs:
  rewrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Rewrap authenticated evidence without persistent plaintext
        env:
          GH_TOKEN: ${{ github.token }}
          MYSIM_INTAKE_KEY: ${{ secrets.MYSIM_INTAKE_KEY }}
          MYSIM_REVIEW_KEY: ${{ secrets.MYSIM_REVIEW_KEY }}
          REVIEW_ASSETS: ${{ inputs.assets }}
        run: python tools/cloud_rewrap_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-rewrap-metadata
          path: |
            review-rewrap-results.json
            outputs/review-rewrap/*.enc
          retention-days: 14
