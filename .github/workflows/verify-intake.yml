name: verify-complete-intake
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
concurrency: {group: verify-complete-intake, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact candidate counts and conversion outcomes across all 316 batches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python tools/cloud_verify_intake.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: complete-intake-verification, path: outputs/cloud-intake-verification, retention-days: 14}
